<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recursive Tree</title><style>:root{--viz-series-1:#287862}body{margin:0;background:#f7faf8;color:#203b32;font:16px system-ui,sans-serif}#tree-demo{max-width:820px;margin:40px auto;padding:24px}h3{font-size:24px}.viz-controls{display:flex;flex-wrap:wrap;gap:24px;margin:24px 0}.form-label{flex:1;min-width:180px}.form-range{display:block;width:100%;margin-top:12px;accent-color:#287862}.viz-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.btn{padding:12px 20px;background:#287862;color:white;border:0;border-radius:8px;font:inherit;cursor:pointer}output{font-variant-numeric:tabular-nums}button:focus-visible,input:focus-visible{outline:3px solid #c18a37;outline-offset:4px}</style></head><body><div id="tree-demo">
<h3>Recursive Tree</h3>
<div class="viz-controls">
<label class="form-label">Depth <output id="depth-val">6</output><input id="depth" class="form-range" type="range" min="0" max="9" value="6"></label>
<label class="form-label">Branching angle <output id="angle-val">28°</output><input id="angle" class="form-range" type="range" min="10" max="65" value="28"></label>
<label class="form-label">Branch length ratio <output id="ratio-val">0.72</output><input id="ratio" class="form-range" type="range" min="50" max="80" value="72"></label>
</div>
<div class="viz-row"><button id="grow" class="btn btn-primary">Play growth</button><span id="status" aria-live="polite" class="tabular-nums"></span></div>
<svg id="tree-svg" role="img" aria-label="Binary tree with adjustable depth, branching angle, and branch length ratio" style="width:100%;height:360px;display:block"><g id="branches"></g></svg>
</div>
<script>
(()=>{
const root=document.getElementById('tree-demo');
const get=id=>root.querySelector('#'+id);
const depth=get('depth'),angle=get('angle'),ratio=get('ratio'),svg=get('tree-svg'),group=get('branches');
let timer=null;
function draw(level=Number(depth.value)){
 const a=Number(angle.value)*Math.PI/180,r=Number(ratio.value)/100;
 get('depth-val').textContent=depth.value;get('angle-val').textContent=angle.value+'°';get('ratio-val').textContent=r.toFixed(2);
 const nodes=[],edges=[];
 function branch(x,y,heading,length,d){
  nodes.push([x,y,d]);
  if(d===level)return;
  for(const turn of [-a,a]){const h=heading+turn,nx=x+Math.cos(h)*length,ny=y+Math.sin(h)*length;edges.push([x,y,nx,ny,d]);branch(nx,ny,h,length*r,d+1);}
 }
 branch(0,0,-Math.PI/2,85,0);
 const xs=nodes.map(n=>n[0]),ys=nodes.map(n=>n[1]);
 const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
 const w=Math.max(280,svg.clientWidth),h=360,s=Math.min((w-40)/Math.max(1,maxX-minX),(h-40)/Math.max(1,maxY-minY),1.5);
 const tx=w/2-(minX+maxX)*s/2,ty=h/2-(minY+maxY)*s/2;
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 group.innerHTML=edges.map(e=>`<line x1="${e[0]*s+tx}" y1="${e[1]*s+ty}" x2="${e[2]*s+tx}" y2="${e[3]*s+ty}" stroke="var(--viz-series-1)" stroke-width="${Math.max(1,4-e[4]*.5)}" stroke-linecap="round"/>`).join('')+nodes.map(n=>`<circle cx="${n[0]*s+tx}" cy="${n[1]*s+ty}" r="${level<5?3:1.8}" fill="var(--viz-series-1)"/>`).join('');
 get('status').textContent=`Depth ${level} · ${nodes.length} nodes`;
}
function stop(){clearInterval(timer);timer=null;get('grow').textContent='Play growth';}
for(const input of [depth,angle,ratio])input.addEventListener('input',()=>{stop();draw();});
get('grow').addEventListener('click',()=>{if(timer){stop();return;}let current=0;draw(current);if(matchMedia('(prefers-reduced-motion: reduce)').matches){draw();return;}get('grow').textContent='Stop';timer=setInterval(()=>{current++;if(current>Number(depth.value)){stop();return;}draw(current);},550);});
new ResizeObserver(()=>draw()).observe(svg);draw();
})();
</script>
</body></html>
